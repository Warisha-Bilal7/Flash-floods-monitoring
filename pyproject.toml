[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodwatch"
version = "0.2.0"
description = "FloodWatch KP: two-mechanism flash-flood early warning prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "PyYAML>=6",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "torch>=2.2",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "pytest>=7",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
markers = [
    "network: test reaches the network (skipped by default in CI)",
    "slow: test is intentionally slow",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "artifacts", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
